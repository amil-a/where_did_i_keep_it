{% extends "base.html" %}
{% block title %}Delete {{ item.name }} · Where Did I Keep It?{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card border-danger shadow-sm">
      <div class="card-body">
        <h1 class="h4">Delete “{{ item.name }}”?</h1>
        <p class="text-muted">This cannot be undone.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a href="{% url 'item_detail' item.pk %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
